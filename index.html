<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="迈开腿">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>迈开腿 · 3 分钟动一下</title>
<style>
:root{
  --acc:#0F6E56; --acc-l:#E1F5EE; --acc-d:#04342C;
  --ink:#2C2C2A; --mut:#5F5E5A; --hint:#888780;
  --line:#D3D1C7; --bg:#FFFFFF; --bg2:#F1EFE8; --page:#F7F6F2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--page);color:var(--ink);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding:20px 20px 48px}
.view{display:none}
.view.on{display:block}

h1{font-size:20px;font-weight:600;margin:0}
.sub{font-size:13px;color:var(--mut);margin:0}
.label{font-size:12px;color:var(--hint);margin:0 0 8px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.hero{text-align:center;padding:18px 0 6px}
.ringbtn{
  width:212px;height:212px;border-radius:50%;border:3px solid var(--acc);
  background:var(--acc-l);color:var(--acc-d);font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  margin:22px auto 14px;transition:transform .12s ease;
}
.ringbtn:active{transform:scale(.96)}
.ringbtn .go{font-size:30px;font-weight:600;letter-spacing:2px}
.ringbtn .min{font-size:13px;color:var(--acc)}
.summary{font-size:13px;color:var(--mut);text-align:center;margin:0 0 26px}

.group{margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:0.5px solid var(--line);background:transparent;border-radius:999px;
  padding:8px 14px;font-size:13px;color:var(--mut);cursor:pointer;font-family:inherit;
}
.chip.sel{background:var(--acc-l);border-color:var(--acc);color:var(--acc-d);font-weight:500}

.stats{display:flex;gap:12px;margin:22px 0 18px}
.stat{flex:1;background:var(--bg2);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--mut)}
.stat .v{font-size:22px;font-weight:600;line-height:1.3}

.linkrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.txtbtn{background:none;border:0;font-family:inherit;font-size:13px;color:var(--acc);cursor:pointer;padding:6px 0}
.txtbtn.grey{color:var(--hint)}

/* ---------- train ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.step{font-size:12px;color:var(--hint)}
.bars{display:flex;gap:4px;margin:10px 0 18px}
.bar{flex:1;height:4px;border-radius:2px;background:var(--bg2)}
.bar.done{background:var(--acc)}
.bar.cur{background:var(--acc);opacity:.45}

.figcard{background:var(--bg2);border-radius:16px;padding:10px;margin-bottom:16px;text-align:center}
.figcard svg{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.ln{fill:none;stroke:var(--acc);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ln circle{fill:#F1EFE8}
.gnd{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.motion{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 5;opacity:.55}

.now{text-align:center;margin-bottom:4px}
.now .nm{font-size:22px;font-weight:600;margin:0}
.now .cue{font-size:14px;color:var(--mut);margin:8px 20px 0}
.now .ease{font-size:12px;color:var(--hint);margin:10px 20px 0}

.timer{display:flex;flex-direction:column;align-items:center;margin:18px 0 10px;position:relative}
.timer svg{width:132px;height:132px;transform:rotate(-90deg)}
.timer .track{fill:none;stroke:var(--bg2);stroke-width:9}
.timer .prog{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round}
.tnum{position:absolute;top:0;left:0;right:0;height:132px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600}

.next{background:var(--bg2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mut);margin:8px 0 16px;display:flex;justify-content:space-between;gap:10px}

.ctrls{display:flex;gap:10px;margin-bottom:14px}
.btn{flex:1;border:0.5px solid var(--line);background:transparent;border-radius:12px;padding:13px 10px;font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer}
.btn:active{background:var(--bg2)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}

/* ---------- done ---------- */
.done-wrap{text-align:center;padding:40px 0 10px}
.tick{width:88px;height:88px;border-radius:50%;background:var(--acc-l);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.tick svg{width:44px;height:44px}

/* ---------- 编辑 / 添加动作 ---------- */
.field{margin-bottom:16px}
.field input{
  width:100%;border:0.5px solid var(--line);border-radius:12px;padding:12px 14px;
  font-size:15px;font-family:inherit;color:var(--ink);background:#fff;
}
.field input:focus{outline:none;border-color:var(--acc)}
.figpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.figpick div{background:var(--bg2);border-radius:10px;padding:4px;cursor:pointer;border:2px solid transparent}
.figpick div.sel{border-color:var(--acc)}
.figpick svg{width:100%;height:auto;display:block}
.err{font-size:13px;color:#A32D2D;min-height:20px;margin:0}

/* ---------- library ---------- */
.libscene{margin-bottom:26px}
.figcard img{max-width:230px;width:100%;height:auto;display:block;margin:0 auto;border-radius:10px}
.item .th img{width:100%;height:auto;display:block}
.item{display:flex;gap:14px;padding:14px 0;border-top:0.5px solid var(--line);align-items:flex-start}
.item:first-of-type{border-top:0}
.item .th{width:60px;flex:0 0 60px;background:var(--bg2);border-radius:10px;overflow:hidden}
.item .th svg{width:100%;height:auto;display:block}
.item .bd{flex:1;min-width:0}
.item .nm{font-size:15px;font-weight:600;margin:0}
.item .cue{font-size:13px;color:var(--mut);margin:3px 0 0}
.item .ease{font-size:12px;color:var(--hint);margin:4px 0 0}
.vid{display:inline-block;margin-top:8px;font-size:12px;color:var(--acc);text-decoration:none;border:0.5px solid var(--acc);border-radius:999px;padding:4px 10px}
h2.st{font-size:15px;font-weight:600;margin:0 0 2px}
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <section id="v-home" class="view on">
    <div class="hero">
      <h1>迈开腿</h1>
      <p class="sub">别想了，动就行</p>
    </div>

    <button class="ringbtn" id="btnStart">
      <span class="go">开始</span>
      <span class="min" id="startMin">3 分钟</span>
    </button>
    <p class="summary" id="summary"></p>

    <div class="group">
      <p class="label">在哪儿</p>
      <div class="chips" id="chScene"></div>
    </div>
    <div class="group">
      <p class="label">多久</p>
      <div class="chips" id="chDur"></div>
    </div>
    <div class="group">
      <p class="label">今天想重点</p>
      <div class="chips" id="chFocus"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">连续打卡</div><div class="v mono"><span id="stStreak">0</span> 天</div></div>
      <div class="stat"><div class="k">今天已动</div><div class="v mono"><span id="stToday">0</span> 分</div></div>
      <div class="stat"><div class="k">累计</div><div class="v mono"><span id="stTotal">0</span> 分</div></div>
    </div>

    <div class="linkrow">
      <button class="txtbtn" id="btnLib">动作库 · 看演示</button>
      <button class="txtbtn grey" id="btnSound">声音：开</button>
    </div>
    <div class="linkrow">
      <button class="txtbtn" id="btnAdd">＋ 添加我自己的动作</button>
      <span class="sub" id="myCount" style="font-size:12px;color:var(--hint)"></span>
    </div>
    <p class="sub" style="margin-top:14px;font-size:12px;color:var(--hint)">选择会自动记住，下次打开直接点开始。</p>
  </section>

  <!-- ============ TRAIN ============ -->
  <section id="v-train" class="view">
    <div class="topbar">
      <button class="txtbtn" id="btnQuit" style="padding:0">结束</button>
      <span class="step mono" id="stepTxt"></span>
    </div>
    <div class="bars" id="bars"></div>

    <div class="figcard" id="figCard"></div>

    <div class="now">
      <p class="nm" id="actName"></p>
      <p class="cue" id="actCue"></p>
      <p class="ease" id="actEase"></p>
    </div>

    <div class="timer">
      <svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="52"></circle>
        <circle class="prog" id="prog" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="tnum mono" id="tnum">30</div>
    </div>

    <div class="next"><span>下一个</span><span id="nextName"></span></div>

    <div class="ctrls">
      <button class="btn" id="btnPause">暂停</button>
      <button class="btn" id="btnSkip">跳过</button>
    </div>
    <div style="text-align:center">
      <a class="vid" id="vidLink" href="#" target="_blank" rel="noopener">看真人演示 →</a>
    </div>
  </section>

  <!-- ============ DONE ============ -->
  <section id="v-done" class="view">
    <div class="done-wrap">
      <div class="tick">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5.5 5.5L20 7"></path>
        </svg>
      </div>
      <h1 id="doneTitle">搞定</h1>
      <p class="sub" id="doneSub"></p>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">连续打卡</div><div class="v mono"><span id="dStreak">0</span> 天</div></div>
      <div class="stat"><div class="k">今天已动</div><div class="v mono"><span id="dToday">0</span> 分</div></div>
      <div class="stat"><div class="k">累计</div><div class="v mono"><span id="dTotal">0</span> 分</div></div>
    </div>
    <div class="ctrls">
      <button class="btn main" id="btnAgain">再来一组</button>
      <button class="btn" id="btnHome">回首页</button>
    </div>
  </section>

  <!-- ============ LIBRARY ============ -->
  <section id="v-lib" class="view">
    <div class="topbar">
      <button class="txtbtn" id="btnLibBack" style="padding:0">返回</button>
      <button class="txtbtn" id="btnAdd2">＋ 添加动作</button>
    </div>
    <p class="sub" style="margin:12px 0 20px">点「看真人演示」跳转视频。带「编辑」的是你自己加的动作。</p>
    <div id="libBody"></div>
  </section>

  <!-- ============ ADD / EDIT ============ -->
  <section id="v-edit" class="view">
    <div class="topbar">
      <button class="txtbtn" id="btnEditBack" style="padding:0">取消</button>
      <span class="step" id="editTitle">添加动作</span>
    </div>

    <div class="field" style="margin-top:18px">
      <p class="label">动作名称 *</p>
      <input id="fName" type="text" placeholder="比如：靠墙静蹲">
    </div>
    <div class="field">
      <p class="label">要点（一句话提醒自己）</p>
      <input id="fCue" type="text" placeholder="比如：膝盖不超过脚尖，大腿与地面平行">
    </div>
    <div class="field">
      <p class="label">降阶版本（做不动时怎么办）</p>
      <input id="fEase" type="text" placeholder="比如：蹲浅一点，时间缩短">
    </div>
    <div class="field">
      <p class="label">属于哪些场景 *</p>
      <div class="chips" id="fScene"></div>
    </div>
    <div class="field">
      <p class="label">算作哪类重点</p>
      <div class="chips" id="fFocus"></div>
    </div>
    <div class="field">
      <p class="label">选一个图示</p>
      <div class="figpick" id="fFig"></div>
    </div>
    <div class="field">
      <p class="label">图片链接（可选，填了就用你的图）</p>
      <input id="fImg" type="url" placeholder="https://...">
    </div>
    <div class="field">
      <p class="label">视频链接（可选，填了就跳你的视频）</p>
      <input id="fVid" type="url" placeholder="https://...">
    </div>

    <p class="err" id="fMsg"></p>
    <div class="ctrls">
      <button class="btn main" id="btnSave">保存</button>
      <button class="btn" id="btnDel">删除</button>
    </div>
  </section>

</div>

var S = {
  scene: localStorage.getItem('move.scene') || 'desk',
  dur:   parseInt(localStorage.getItem('move.dur') || '3', 10),
  focus: localStorage.getItem('move.focus') || 'full',

};
function save(){ localStorage.setItem('move.scene',S.scene); localStorage.setItem('move.dur',S.dur);
  localStorage.setItem('move.focus',S.focus); localStorage.setItem('move.sound',S.sound?'1':'0'); }

function today(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function readJSON(k,d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
var STAT = readJSON('move.stat', {streak:0, last:'', total:0, todayDate:'', todayMin:0});
if(STAT.todayDate !== today()){ STAT.todayDate = today(); STAT.todayMin = 0; }
function saveStat(){ localStorage.setItem('move.stat', JSON.stringify(STAT)); }

function buildSeq(){
  var ids = SCENES[S.scene].ids.slice();
  ids.sort(function(a,b){
    var pa = A[a].fo.indexOf(S.focus) === -1 ? 1 : 0;
    var pb = A[b].fo.indexOf(S.focus) === -1 ? 1 : 0;
    return pa - pb;
  });
  var n = Math.round(S.dur * 60 / 30);
  var out = [];
  for(var i=0;i<n;i++){ out.push(ids[i % ids.length]); }
  return out;
}

/* ================= 声音 ================= */
var ac = null;
function beep(freq, ms){
  if(!S.sound) return;
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + ms/1000);
    o.start(); o.stop(ac.currentTime + ms/1000 + 0.02);
  }catch(e){}
}
function say(t){
  if(!S.sound || !window.speechSynthesis) return;
  try{
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN'; u.rate = 1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= 训练 ================= */
var RUN = {seq:[], i:0, left:30, timer:null, paused:false, endAt:0, remain:0};

function renderBars(){
  var el = document.getElementById('bars');
  el.innerHTML = '';
  for(var i=0;i<RUN.seq.length;i++){
    var d = document.createElement('div');
    d.className = 'bar' + (i < RUN.i ? ' done' : (i === RUN.i ? ' cur' : ''));
    el.appendChild(d);
  }
}
function loadAction(){
  var id = RUN.seq[RUN.i], a = A[id];
  document.getElementById('stepTxt').textContent = '第 ' + (RUN.i+1) + ' / ' + RUN.seq.length + ' 个';
  document.getElementById('figCard').innerHTML = mediaOf(a);
  document.getElementById('actName').textContent = a.n;
  document.getElementById('actCue').textContent = a.c;
  document.getElementById('actEase').textContent = '做不了就降阶：' + (a.e || '幅度减小');
  var nx = RUN.seq[RUN.i+1];
  document.getElementById('nextName').textContent = nx ? A[nx].n : '结束了';
  document.getElementById('vidLink').href = vidOf(a);
  renderBars();
  say(a.n);
  beep(660, 140);
}
function paint(){
  var total = 30;
  var C = 2 * Math.PI * 52;
  var frac = Math.max(0, Math.min(1, RUN.left / total));
  document.getElementById('prog').setAttribute('stroke-dasharray', C);
  document.getElementById('prog').setAttribute('stroke-dashoffset', C * (1 - frac));
  document.getElementById('tnum').textContent = Math.ceil(RUN.left);
}
function tick(){
  if(RUN.paused) return;
  var now = Date.now();
  RUN.left = (RUN.endAt - now) / 1000;
  if(RUN.left <= 0){
    RUN.left = 0; paint(); beep(880, 200);
    RUN.i++;
    if(RUN.i >= RUN.seq.length){ finish(); return; }
    startAction();
  }else{
    paint();
    if(RUN.left <= 3 && Math.ceil(RUN.left) !== RUN.lastBeep){ RUN.lastBeep = Math.ceil(RUN.left); beep(520, 90); }
  }
}
function startAction(){
  RUN.left = 30; RUN.endAt = Date.now() + 30000; RUN.lastBeep = 99;
  loadAction(); paint();
}
function startRun(){
  RUN.seq = buildSeq(); RUN.i = 0; RUN.paused = false;
  show('v-train');
  if(navigator.wakeLock && navigator.wakeLock.request){
    navigator.wakeLock.request('screen').catch(function(){});
  }
  startAction();
  clearInterval(RUN.timer);
  RUN.timer = setInterval(tick, 100);
}
function stopTimer(){ clearInterval(RUN.timer); RUN.timer = null; }

function pauseToggle(){
  RUN.paused = !RUN.paused;
  document.getElementById('btnPause').textContent = RUN.paused ? '继续' : '暂停';
  if(RUN.paused){ stopTimer(); }
  else{
    RUN.endAt = Date.now() + RUN.left * 1000;
    RUN.timer = setInterval(tick, 100);
  }
}
function skip(){
  RUN.i++;
  if(RUN.i >= RUN.seq.length){ finish(); return; }
  startAction();
}
function finish(){
  stopTimer();
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  beep(990, 300);

  var mins = Math.round(RUN.seq.length * 30 / 60);
  var t = today();
  if(STAT.last !== t){
    var y = new Date(); y.setDate(y.getDate() - 1);
    var ys = y.getFullYear()+'-'+('0'+(y.getMonth()+1)).slice(-2)+'-'+('0'+y.getDate()).slice(-2);
    STAT.streak = (STAT.last === ys) ? STAT.streak + 1 : 1;
    STAT.last = t;
  }
  STAT.todayMin += mins; STAT.total += mins;
  saveStat();

  document.getElementById('doneTitle').textContent = mins + ' 分钟，搞定';
  document.getElementById('doneSub').textContent = '你刚才做了 ' + RUN.seq.length + ' 个动作 · ' + SCENES[S.scene].label;
  document.getElementById('dStreak').textContent = STAT.streak;
  document.getElementById('dToday').textContent  = STAT.todayMin;
  document.getElementById('dTotal').textContent  = STAT.total;
  show('v-done');
}

var EDIT = {id:null, scenes:[], focus:[], fig:'A'};

function multiChips(host, opts, arr){
  var el = document.getElementById(host);
  el.innerHTML = '';

    var b = document.createElement('button');
    b.className = 'chip' + (arr.indexOf(o.v) > -1 ? ' sel' : '');
    b.textContent = o.t;
    b.onclick = function(){
      var i = arr.indexOf(o.v);
      if(i > -1) arr.splice(i, 1); else arr.push(o.v);
      multiChips(host, opts, arr);
    };
    el.appendChild(b);
  });
}
function renderFigPick(){
  var el = document.getElementById('fFig');
  el.innerHTML = '';
  Object.keys(FIG).forEach(function(k){
    var d = document.createElement('div');
    if(k === EDIT.fig) d.className = 'sel';
    d.innerHTML = svgOf(k);
    d.onclick = function(){ EDIT.fig = k; renderFigPick(); };
    el.appendChild(d);
  });
}
function openEdit(id){
  EDIT.id = id || null;
  var a = id ? A[id] : null;
  EDIT.scenes = a ? (a.scenes || []).slice() : [S.scene];
  EDIT.focus  = a ? (a.fo || []).slice() : [S.focus];
  EDIT.fig    = a ? a.f : 'A';

  document.getElementById('editTitle').textContent = id ? '编辑动作' : '添加动作';
  document.getElementById('fName').value = a ? a.n : '';
  document.getElementById('fCue').value  = a ? a.c : '';
  document.getElementById('fEase').value = a ? a.e : '';
  document.getElementById('fImg').value  = (a && a.img) ? a.img : '';
  document.getElementById('fVid').value  = (a && a.vid) ? a.vid : '';
  document.getElementById('btnDel').style.display = id ? '' : 'none';
  document.getElementById('fMsg').textContent = '';

  var sc = [], fo = [];
  Object.keys(SCENES).forEach(function(k){ sc.push({v:k, t:SCENES[k].label}); });
  Object.keys(FOCUS).forEach(function(k){ fo.push({v:k, t:FOCUS[k]}); });
  multiChips('fScene', sc, EDIT.scenes);
  multiChips('fFocus', fo, EDIT.focus);
  renderFigPick();
  show('v-edit');
}
function saveEdit(){
  var n = document.getElementById('fName').value.trim();
  var msg = document.getElementById('fMsg');
  if(!n){ msg.textContent = '动作名称必填'; return; }
  if(!EDIT.scenes.length){ msg.textContent = '至少选一个场景'; return; }

  var cue  = document.getElementById('fCue').value.trim()  || '跟着感觉做，动作慢一点';
  var ease = document.getElementById('fEase').value.trim() || '幅度减小，速度放慢';
  var img  = document.getElementById('fImg').value.trim();
  var vid  = document.getElementById('fVid').value.trim();

  if(EDIT.id){
    for(var i=0;i<CUSTOM.length;i++){
      if(CUSTOM[i].id === EDIT.id){
        CUSTOM[i].n = n; CUSTOM[i].c = cue; CUSTOM[i].e = ease; CUSTOM[i].f = EDIT.fig;
        CUSTOM[i].fo = EDIT.focus.slice(); CUSTOM[i].scenes = EDIT.scenes.slice();
        CUSTOM[i].img = img; CUSTOM[i].vid = vid;
      }
    }
  }else{
    CUSTOM.push({id:'u_' + Date.now(), n:n, c:cue, e:ease, f:EDIT.fig,
      fo:EDIT.focus.slice(), scenes:EDIT.scenes.slice(), img:img, vid:vid, own:true});
  }
  saveCustom();
  renderLib(); show('v-lib');
}
function delEdit(){
  if(!EDIT.id) return;
  if(!window.confirm('删除「' + A[EDIT.id].n + '」？')) return;
  CUSTOM = CUSTOM.filter(function(x){ return x.id !== EDIT.id; });
  delete A[EDIT.id];
  saveCustom();
  renderLib(); show('v-lib');
}

document.getElementById('btnQuit').onclick  = function(){ stopTimer(); if(window.speechSynthesis) window.speechSynthesis.cancel(); show('v-home'); renderHome(); };
document.getElementById('btnAgain').onclick = startRun;
document.getElementById('btnHome').onclick  = function(){ show('v-home'); renderHome(); };
document.getElementById('btnLib').onclick   = function(){ renderLib(); show('v-lib'); };
document.getElementById('btnLibBack').onclick = function(){ show('v-home'); renderHome(); };
document.getElementById('btnSound').onclick = function(){ S.sound = !S.sound; save(); renderHome(); };
document.getElementById('btnAdd').onclick   = function(){ openEdit(null); };
document.getElementById('btnAdd2').onclick  = function(){ openEdit(null); };
document.getElementById('btnEditBack').onclick = function(){ renderLib(); show('v-lib'); };
document.getElementById('btnSave').onclick  = saveEdit;
document.getElementById('btnDel').onclick   = delEdit;

document.addEventListener('keydown', function(e){
  if(e.code === 'Space'){
    if(document.getElementById('v-train').classList.contains('on')){ e.preventDefault(); pauseToggle(); }
    else if(document.getElementById('v-home').classList.contains('on')){ e.preventDefault(); startRun(); }
  }
});

loadCustom();
renderHome();
</script>
</body>
